{% load erp_tags %}
{% if question %}<div class="bubble user">{{ question }}</div>{% endif %}
{% if answer %}
    <div class="bubble bot">{{ answer|simple_markdown }}{% if tools %}<p class="small muted">Nguồn dữ liệu: {{ tools|join:", " }}</p>{% endif %}</div>
{% elif error %}
    <div class="bubble error">{{ error }}</div>
{% endif %}
